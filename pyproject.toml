[project]
name = "dashbord"
version = "2.0.0.dev0"
description = "Personlig hverdagsdashbord med vanesporing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "httpx2",           # brukes av FastAPIs TestClient
    "pytest>=8",
    "ruff>=0.6",
    "uvicorn>=0.32",    # lokal utviklingsserver
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: feil, I: importrekkefølge, UP: moderne Python, B: vanlige bugs, S: sikkerhet (bandit)
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert er greit i tester

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
