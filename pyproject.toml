[project]
name = "dashbord"
version = "2.0.0.dev0"
description = "Personlig hverdagsdashbord med vanesporing"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlmodel>=0.0.22",
    "webauthn>=2.2",
]

[dependency-groups]
dev = [
    "httpx2",           # brukes av FastAPIs TestClient
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.6",
    "uvicorn>=0.32",    # lokal utviklingsserver
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: feil, I: importrekkefølge, UP: moderne Python, B: vanlige bugs, S: sikkerhet (bandit)
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert og falske passord er greit i tester

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
