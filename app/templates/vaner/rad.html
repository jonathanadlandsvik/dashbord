{%- set er_gjort = (v.id, dag) in gjort -%}
<button class="vane{% if er_gjort %} gjort{% endif %}" id="vane-{{ v.id }}" type="button"
        aria-pressed="{{ 'true' if er_gjort else 'false' }}"
        hx-post="/vaner/kryss" hx-vals='{"vane_id": "{{ v.id }}", "dato": "{{ dag.isoformat() }}"}'
        hx-target="this" hx-swap="outerHTML">
  <span class="hake" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></span>
  <span class="vanetekst">
    <span class="navn">{{ v.navn }}</span>
    <span class="formulering">{{ v.formulering }}</span>
  </span>
</button>
