name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

# Minste privilegium: jobben trenger bare å lese koden.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # et heng skal stoppe raskt, ikke kjøre i timevis

    # En egen Postgres bare for testene. Testene sletter og lager tabellene
    # på nytt, så de skal aldri kjøre mot Neon.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Installer avhengigheter (nøyaktig som i uv.lock)
        run: uv sync --locked

      - name: Formatering
        run: uv run ruff format --check .

      - name: Lint og sikkerhetsregler
        run: uv run ruff check .

      - name: Tester
        run: uv run pytest

      - name: Kjente sårbarheter i avhengigheter
        run: uv run --with pip-audit pip-audit
